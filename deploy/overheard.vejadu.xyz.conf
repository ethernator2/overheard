# Apache vhost for overheard.vejadu.xyz
#
# Assumes the repo lives at /opt/overheard on the Debian box and PHP runs
# via mod_php (Debian's default with libapache2-mod-php). DocumentRoot
# points at web/ specifically — firehose/, haiku_engine/, sonification/,
# and the .env files with real DB credentials all live outside web/, so
# none of it is reachable over HTTP regardless of this config, but the
# explicit deny below is cheap insurance against a future path change.
#
# Install:
#   sudo cp deploy/overheard.vejadu.xyz.conf /etc/apache2/sites-available/
#   sudo a2ensite overheard.vejadu.xyz
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Then, once the DNS A record for overheard.vejadu.xyz is live and
# resolving to this server:
#   sudo apt install certbot python3-certbot-apache
#   sudo certbot --apache -d overheard.vejadu.xyz
# certbot rewrites this file in place to add the :443 vhost and redirect
# — no separate SSL vhost needed here.

<VirtualHost *:80>
    ServerName overheard.vejadu.xyz

    DocumentRoot /opt/overheard/web

    <Directory /opt/overheard/web>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Belt-and-braces: never serve the config file's raw source even if
    # DocumentRoot ever changes. PHP has already run by the time this
    # would matter, but there's no reason to leave the door ajar.
    <FilesMatch "^config(\.example)?\.php$">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/overheard-error.log
    CustomLog ${APACHE_LOG_DIR}/overheard-access.log combined
</VirtualHost>
